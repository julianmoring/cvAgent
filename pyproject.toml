[project]
name = "cv-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Julián Morín González", email = "julianmoring5@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.16.2",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src --cov-report=term-missing"
